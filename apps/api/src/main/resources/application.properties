spring.application.name=api
server.servlet.context-path=/api
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Lambda sets AWS_REGION; the default covers local runs and CI, which have no AWS environment.
app.aws.region=${AWS_REGION:us-east-1}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/picturepov}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}

spring.datasource.hikari.maximum-pool-size=2
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL
spring.jpa.properties.jakarta.persistence.database-major-version=17

spring.jpa.open-in-view=false

app.aws.region=${AWS_REGION:us-east-1}