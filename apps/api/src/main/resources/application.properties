spring.application.name=api
server.servlet.context-path=/api

#DB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/picturepov}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}
# Cognito: no defaults, so a missing variable stops the startup (dev values: application-local.properties).
app.cognito.user-info-uri=${COGNITO_USER_INFO_URI}
app.cognito.client-id=${COGNITO_CLIENT_ID}

spring.datasource.hikari.maximum-pool-size=2
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL
spring.jpa.properties.jakarta.persistence.database-major-version=17

spring.jpa.open-in-view=false

#AWS
app.aws.region=${AWS_REGION:us-east-1}
app.photos.bucket=${PHOTOS_BUCKET:}
app.photos.max-size-bytes=${PHOTOS_MAX_SIZE_BYTES:20971520}
# P-10. Deployed value comes from Terraform (upload_ttl_minutes); the default is for local runs.
app.photos.upload-url-ttl=${PHOTOS_UPLOAD_URL_TTL:15m}
# P-13. Deployed value comes from Terraform (thumbnail_ttl_minutes); the default is for local runs.
app.photos.thumbnail-url-ttl=${PHOTOS_THUMBNAIL_URL_TTL:15m}
# P-12. Deployed value comes from Terraform (download_ttl_minutes); the default is for local runs.
app.photos.download-url-ttl=${PHOTOS_DOWNLOAD_URL_TTL:15m}
# The ZIP worker's queue (lambda_zip_export queue_url). Empty locally: a request is then marked failed.
app.zips.queue-url=${ZIP_EXPORT_QUEUE_URL:}
# P-07. Deployed value comes from Terraform (zip_download_ttl_minutes); the default is for local runs.
app.zips.download-url-ttl=${ZIP_DOWNLOAD_URL_TTL:24h}
# How long a ZIP stays in progress before it is shown failed (ZipExport.isInProgress). Deployed value comes from Terraform (lambda_zip_export max_run_minutes).
app.zips.max-run=${ZIP_EXPORT_MAX_RUN:48m}

#Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=cognito:groups
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
