spring.application.name=api
server.servlet.context-path=/api

#DB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/picturepov}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}
app.cognito.user-info-uri=${COGNITO_USER_INFO_URI:https://pictures-pov-dev.auth.us-east-1.amazoncognito.com/oauth2/userInfo}
app.cognito.client-id=${COGNITO_CLIENT_ID:k0m0afi95gc72t8ff3p7o6peq}

spring.datasource.hikari.maximum-pool-size=2
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL
spring.jpa.properties.jakarta.persistence.database-major-version=17

spring.jpa.open-in-view=false

#AWS
app.aws.region=${AWS_REGION:us-east-1}
app.photos.bucket=${PHOTOS_BUCKET:}
app.photos.max-size-bytes=${PHOTOS_MAX_SIZE_BYTES:20971520}
app.photos.upload-url-ttl=${PHOTOS_UPLOAD_URL_TTL:5m}

#Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_9zczJDp4m}
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=cognito:groups
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
