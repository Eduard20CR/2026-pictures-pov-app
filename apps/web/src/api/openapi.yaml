openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081
  description: Generated server url
paths:
  /events/{publicCode}:
    get:
      tags:
      - event-controller
      operationId: getByPublicCode
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Active event
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicEventResponse"
        "404":
          description: Event does not exist or is not active
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /db-check:
    get:
      tags:
      - test-controller
      operationId: dbCheck
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    PublicEventResponse:
      type: object
      properties:
        publicCode:
          type: string
        name:
          type: string
        color:
          type: string
        eventDate:
          type: string
          format: date
        imagesPerUser:
          type: integer
          format: int32
      required:
      - color
      - eventDate
      - imagesPerUser
      - name
      - publicCode
