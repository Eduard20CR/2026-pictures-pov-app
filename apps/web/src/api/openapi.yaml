openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081/api
  description: Generated server url
paths:
  /me/events/{id}/zip-export:
    get:
      tags:
      - zip-export-controller
      operationId: getZipExport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "The event's latest ZIP, with a fresh download link when available"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ZipExportResponse"
        "204":
          description: No ZIP was requested for the event yet
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Moderator of the event: the ZIP is organizer-only (RN-05)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "No Accepted invitation to the event, or it does not exist\
            \ or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
    post:
      tags:
      - zip-export-controller
      operationId: requestZipExport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: "The ZIP is generated in the background; the one already in\
            \ progress if any, so no second generation starts"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ZipExportResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Moderator of the event: the ZIP is organizer-only (RN-05)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "No Accepted invitation to the event, or it does not exist\
            \ or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "NO_PHOTOS_TO_EXPORT: the event has no processed photo"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me/events/{id}/invitations:
    post:
      tags:
      - invitation-controller
      operationId: inviteModerator
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteModeratorRequest"
        required: true
      responses:
        "201":
          description: "Pending MODERATOR invitation for the email, even if it has\
            \ no account"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          description: Invalid or missing email
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Moderator of the event: inviting is organizer-only"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "No Accepted invitation to the event, or it does not exist\
            \ or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: The email already has an invitation to the event
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /events/{publicCode}/uploads:
    post:
      tags:
      - image-upload-controller
      operationId: createPresignedUpload
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignedUploadRequest"
        required: true
      responses:
        "201":
          description: Upload reserved; PUT the photo once to uploadUrl with If-None-Match
            set to * (412 means it is already stored)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PresignedUploadResponse"
        "400":
          description: "Unsupported type, invalid size or malformed body"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Event does not exist, is archived or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Upload limit reached, or the event is closed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /admin/events:
    get:
      tags:
      - admin-event-controller
      operationId: listAllEvents
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: "All events, newest event date first"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminEventPage"
        "400":
          description: Invalid page or size
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Not an administrator
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
    post:
      tags:
      - admin-event-controller
      operationId: createEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        required: true
      responses:
        "201":
          description: "Event created Open, with an OWNER invitation for the organizer\
            \ email"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminEventResponse"
        "400":
          description: Invalid or missing fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Not an administrator
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me/invitations/{id}:
    patch:
      tags:
      - my-invitations-controller
      operationId: updateInvitation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvitationRequest"
        required: true
      responses:
        "204":
          description: "Accepted and linked to the signed-in user: the event joins\
            \ their events with the invitation's role"
        "400":
          description: Status missing or other than ACCEPTED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Email not verified, or the invitation is for another email"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "No Pending invitation with that id: removed, already accepted,\
            \ its event deleted, or never existed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me:
    get:
      tags:
      - current-user-controller
      operationId: getCurrentUser
      responses:
        "200":
          description: Signed-in user; created on the first call
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me/invitations:
    get:
      tags:
      - my-invitations-controller
      operationId: listMyPendingInvitations
      responses:
        "200":
          description: "Pending invitations for the signed-in user's verified email,\
            \ newest first; empty if the email is not verified"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingInvitationResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me/events:
    get:
      tags:
      - my-events-controller
      operationId: listMyEvents
      responses:
        "200":
          description: "Events where the signed-in user holds an Accepted invitation,\
            \ newest event date first"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyEventResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me/events/{id}:
    get:
      tags:
      - my-events-controller
      operationId: getMyEvent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "The event, with the signed-in user's role"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MyEventResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "No Accepted invitation to the event, or it does not exist\
            \ or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me/events/{id}/images:
    get:
      tags:
      - review-images-controller
      operationId: listImages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 100
          minimum: 1
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "The review: every photo of the event, hidden ones included,\
            \ newest first"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewImagePage"
        "400":
          description: Invalid limit or malformed cursor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "No Accepted invitation to the event, or it does not exist\
            \ or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me/events/{id}/images/{imageId}/download:
    get:
      tags:
      - image-download-controller
      operationId: downloadLink
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: A temporary signed link that downloads the photo's original
            file
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImageDownloadResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: "Moderator of the event: downloading is organizer-only (RN-05)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "No Accepted invitation to the event, it does not exist or\
            \ was deleted, or the photo is not the event's or is still processing"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /events/{publicCode}:
    get:
      tags:
      - guest-event-controller
      operationId: getGuestEvent
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Open event
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GuestEventResponse"
        "404":
          description: "Event does not exist, is archived or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Event is closed and no longer accepts photos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /events/{publicCode}/quota:
    get:
      tags:
      - guest-quota-controller
      operationId: getUploadQuota
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Upload quota of the current device
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UploadQuotaResponse"
        "404":
          description: "Event does not exist, is archived or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Event is closed and no longer accepts photos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
components:
  schemas:
    ApiProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          enum:
          - EVENT_NOT_FOUND
          - UPLOAD_LIMIT_REACHED
          - UNSUPPORTED_CONTENT_TYPE
          - FILE_TOO_LARGE
          - INVALID_FILE_SIZE
          - EVENT_CLOSED
          - MALFORMED_REQUEST_BODY
          - VALIDATION_FAILED
          - INVITATION_ALREADY_EXISTS
          - INVITATION_NOT_FOUND
          - INVALID_CURSOR
          - IMAGE_NOT_FOUND
          - NO_PHOTOS_TO_EXPORT
          - BAD_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - INTERNAL_ERROR
        errors:
          type: array
          description: Invalid fields; only with VALIDATION_FAILED
          items:
            $ref: "#/components/schemas/FieldError"
      required:
      - code
      - status
      - title
      - type
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    ZipExportResponse:
      type: object
      properties:
        status:
          type: string
          description: "IN_PROGRESS while queued or running, AVAILABLE once it can\
            \ be downloaded, FAILED otherwise"
          enum:
          - IN_PROGRESS
          - AVAILABLE
          - FAILED
        requestedAt:
          type: string
          format: date-time
        imageCount:
          type: integer
          format: int32
          description: Photos in the ZIP; only when AVAILABLE
        sizeBytes:
          type: integer
          format: int64
          description: Size of the ZIP in bytes; only when AVAILABLE
        downloadUrl:
          type: string
          description: "Temporary signed link that downloads the ZIP, valid for P-07\
            \ (RNF-SEG-05); only when AVAILABLE"
      required:
      - requestedAt
      - status
    InviteModeratorRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: beto@example.com
          maxLength: 320
          minLength: 0
      required:
      - email
    InvitationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Stored in lowercase
        role:
          type: string
          enum:
          - OWNER
          - MODERATOR
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
      required:
      - email
      - id
      - role
      - status
    PresignedUploadRequest:
      type: object
      properties:
        contentType:
          type: string
          example: image/jpeg
        sizeBytes:
          type: integer
          format: int64
          example: 3145728
      required:
      - contentType
      - sizeBytes
    PresignedUploadResponse:
      type: object
      properties:
        imageId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - imageId
      - uploadUrl
    CreateEventRequest:
      type: object
      properties:
        name:
          type: string
          example: Boda Ana y Luis
          maxLength: 100
          minLength: 0
        eventDate:
          type: string
          format: date
          example: 2026-12-20
        organizerEmail:
          type: string
          format: email
          example: ana@example.com
          maxLength: 320
          minLength: 0
      required:
      - eventDate
      - name
      - organizerEmail
    AdminEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
        name:
          type: string
        eventDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
          - ARCHIVED
        organizerEmail:
          type: string
          description: Email of the OWNER invitation; null when the event has none
      required:
      - eventDate
      - id
      - name
      - publicCode
      - status
    UpdateInvitationRequest:
      type: object
      properties:
        status:
          type: string
          description: "Only ACCEPTED: declining is out of scope"
          enum:
          - ACCEPTED
      required:
      - status
    CurrentUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
      required:
      - email
      - id
    PendingInvitationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - MODERATOR
      required:
      - eventId
      - eventName
      - id
      - role
    MyEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
        name:
          type: string
        eventDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
          - ARCHIVED
        role:
          type: string
          description: The signed-in user's role on the event
          enum:
          - OWNER
          - MODERATOR
      required:
      - eventDate
      - id
      - name
      - publicCode
      - role
      - status
    ReviewImagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewImageResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: Pass as cursor for the next page; null on the last page
      required:
      - items
      - nextCursor
    ReviewImageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        thumbnailUrl:
          type:
          - string
          - "null"
          description: Temporary signed link (RNF-SEG-05); null until the thumbnail
            is generated
        hidden:
          type: boolean
          description: Left out of the gallery
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - hidden
      - id
      - thumbnailUrl
    ImageDownloadResponse:
      type: object
      properties:
        url:
          type: string
          description: "Temporary signed link to the original file, served as a download\
            \ (RNF-SEG-05)"
      required:
      - url
    GuestEventResponse:
      type: object
      properties:
        publicCode:
          type: string
        name:
          type: string
        color:
          type: string
        eventDate:
          type: string
          format: date
        imagesPerUser:
          type: integer
          format: int32
      required:
      - color
      - eventDate
      - imagesPerUser
      - name
      - publicCode
    UploadQuotaResponse:
      type: object
      properties:
        limit:
          type: integer
          format: int32
        used:
          type: integer
          format: int32
        remaining:
          type: integer
          format: int32
      required:
      - limit
      - remaining
      - used
    AdminEventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminEventResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
