openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081/api
  description: Generated server url
paths:
  /{publicCode}/uploads:
    post:
      tags:
      - image-controller
      operationId: createUpload
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
        required: true
      responses:
        "201":
          description: Upload reserved; PUT the photo to uploadUrl
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Unsupported type or invalid size
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Event does not exist or is not active
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Upload limit reached
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /events/{publicCode}:
    get:
      tags:
      - event-controller
      operationId: getByPublicCode
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Active event
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicEventResponse"
        "404":
          description: Event does not exist or is not active
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /events/{publicCode}/quota:
    get:
      tags:
      - guest-controller
      operationId: getQuota
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Upload quota of the current device
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuotaResponse"
        "404":
          description: Event does not exist or is not active
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /db-check:
    get:
      tags:
      - test-controller
      operationId: dbCheck
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    UploadRequest:
      type: object
      properties:
        contentType:
          type: string
          example: image/jpeg
        sizeBytes:
          type: integer
          format: int64
          example: 3145728
      required:
      - contentType
      - sizeBytes
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    UploadResponse:
      type: object
      properties:
        imageId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - imageId
      - uploadUrl
    PublicEventResponse:
      type: object
      properties:
        publicCode:
          type: string
        name:
          type: string
        color:
          type: string
        eventDate:
          type: string
          format: date
        imagesPerUser:
          type: integer
          format: int32
      required:
      - color
      - eventDate
      - imagesPerUser
      - name
      - publicCode
    QuotaResponse:
      type: object
      properties:
        limit:
          type: integer
          format: int32
        used:
          type: integer
          format: int32
        remaining:
          type: integer
          format: int32
      required:
      - limit
      - remaining
      - used
