openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081/api
  description: Generated server url
paths:
  /events/{publicCode}/uploads:
    post:
      tags:
      - image-controller
      operationId: createUpload
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
        required: true
      responses:
        "201":
          description: Upload reserved; PUT the photo once to uploadUrl with If-None-Match
            set to * (412 means it is already stored)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: "Unsupported type, invalid size or malformed body"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "Event does not exist, is archived or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: "Upload limit reached, or the event is closed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /admin/events:
    get:
      tags:
      - admin-event-controller
      operationId: list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: "All events, newest event date first"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminEventPage"
        "400":
          description: Invalid page or size
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Not an administrator
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
    post:
      tags:
      - admin-event-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        required: true
      responses:
        "201":
          description: "Event created Open, with an OWNER invitation for the organizer\
            \ email"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminEventResponse"
        "400":
          description: Invalid or missing fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Not an administrator
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me:
    get:
      tags:
      - me-controller
      operationId: me
      responses:
        "200":
          description: Signed-in user; created on the first call
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me/events:
    get:
      tags:
      - my-events-controller
      operationId: myEvents
      responses:
        "200":
          description: "Events where the signed-in user holds an Accepted invitation,\
            \ newest event date first"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyEventResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /me/events/{id}:
    get:
      tags:
      - my-events-controller
      operationId: myEvent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "The event, with the signed-in user's role"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MyEventResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "404":
          description: "No Accepted invitation to the event, or it does not exist\
            \ or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /events/{publicCode}:
    get:
      tags:
      - event-controller
      operationId: getByPublicCode
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Open event
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicEventResponse"
        "404":
          description: "Event does not exist, is archived or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Event is closed and no longer accepts photos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /events/{publicCode}/quota:
    get:
      tags:
      - guest-controller
      operationId: getQuota
      parameters:
      - name: publicCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Upload quota of the current device
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuotaResponse"
        "404":
          description: "Event does not exist, is archived or was deleted"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "409":
          description: Event is closed and no longer accepts photos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
components:
  schemas:
    UploadRequest:
      type: object
      properties:
        contentType:
          type: string
          example: image/jpeg
        sizeBytes:
          type: integer
          format: int64
          example: 3145728
      required:
      - contentType
      - sizeBytes
    ApiProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          enum:
          - EVENT_NOT_FOUND
          - UPLOAD_LIMIT_REACHED
          - UNSUPPORTED_CONTENT_TYPE
          - FILE_TOO_LARGE
          - INVALID_FILE_SIZE
          - EVENT_CLOSED
          - MALFORMED_REQUEST_BODY
          - VALIDATION_FAILED
          - BAD_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - INTERNAL_ERROR
        errors:
          type: array
          description: Invalid fields; only with VALIDATION_FAILED
          items:
            $ref: "#/components/schemas/FieldError"
      required:
      - code
      - status
      - title
      - type
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    UploadResponse:
      type: object
      properties:
        imageId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - imageId
      - uploadUrl
    CreateEventRequest:
      type: object
      properties:
        name:
          type: string
          example: Boda Ana y Luis
          maxLength: 100
          minLength: 0
        eventDate:
          type: string
          format: date
          example: 2026-12-20
        organizerEmail:
          type: string
          format: email
          example: ana@example.com
          maxLength: 320
          minLength: 0
      required:
      - eventDate
      - name
      - organizerEmail
    AdminEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
        name:
          type: string
        eventDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
          - ARCHIVED
        organizerEmail:
          type: string
          description: Email of the OWNER invitation; null when the event has none
      required:
      - eventDate
      - id
      - name
      - publicCode
      - status
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
      required:
      - email
      - id
    MyEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
        name:
          type: string
        eventDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
          - ARCHIVED
        role:
          type: string
          description: The signed-in user's role on the event
          enum:
          - OWNER
          - MODERATOR
      required:
      - eventDate
      - id
      - name
      - publicCode
      - role
      - status
    PublicEventResponse:
      type: object
      properties:
        publicCode:
          type: string
        name:
          type: string
        color:
          type: string
        eventDate:
          type: string
          format: date
        imagesPerUser:
          type: integer
          format: int32
      required:
      - color
      - eventDate
      - imagesPerUser
      - name
      - publicCode
    QuotaResponse:
      type: object
      properties:
        limit:
          type: integer
          format: int32
        used:
          type: integer
          format: int32
        remaining:
          type: integer
          format: int32
      required:
      - limit
      - remaining
      - used
    AdminEventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminEventResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
