name: API CI Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DB_URL: jdbc:postgresql://localhost:5432/picturepov
  DB_USER: app
  DB_PASSWORD: app

jobs:
  api-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: picturepov
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Set up Liquibase
        uses: liquibase/setup-liquibase@9bd28bc8b31bd5a1651b34c7856569d5392ee869 # v3.0.0
        with:
          version: "5.0.3"
          edition: community

      - name: Install Postgres driver
        run: liquibase lpm add postgresql --global

      - name: Migrate test database
        working-directory: db
        env:
          LIQUIBASE_COMMAND_URL: ${{ env.DB_URL }}
          LIQUIBASE_COMMAND_USERNAME: ${{ env.DB_USER }}
          LIQUIBASE_COMMAND_PASSWORD: ${{ env.DB_PASSWORD }}
        run: liquibase update

      - name: Build and test API
        working-directory: apps/api
        env:
          SPRING_DATASOURCE_URL: ${{ env.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ env.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.DB_PASSWORD }}
        run: ./mvnw -B verify
