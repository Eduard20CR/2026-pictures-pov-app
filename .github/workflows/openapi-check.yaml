name: OpenAPI Contract Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  openapi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build API
        working-directory: apps/api
        run: ./mvnw -B -q package -DskipTests

      - name: Start API
        working-directory: apps/api
        run: java -jar target/api-0.0.1-SNAPSHOT.jar --server.port=8081 > api.log 2>&1 &

      - name: Download contract
        run: >
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused
          http://localhost:8081/v3/api-docs.yaml
          -o apps/web/src/api/openapi.yaml

      - name: Generate types
        working-directory: apps/web
        run: npm run api:types

      - name: Fail if they differ from the commit
        run: git diff --exit-code apps/web/src/api/
