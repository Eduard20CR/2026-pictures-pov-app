name: Upload Cleanup CI Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  upload-cleanup-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/upload-cleanup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/upload-cleanup/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
