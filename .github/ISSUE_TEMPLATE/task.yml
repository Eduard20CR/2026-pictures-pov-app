name: Technical task
description: Enabling work with no direct user value (infrastructure, CI/CD, refactoring, ADR).
labels: ["type: task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when the task is done, and why it is needed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: References
