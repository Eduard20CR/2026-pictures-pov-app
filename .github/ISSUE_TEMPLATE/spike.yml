name: Spike
description: Timeboxed research to answer a question before committing to an implementation.
labels: ["type: spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: For example, a comparison, a prototype with measurements or an ADR.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: 1 day
    validations:
      required: true
