databaseChangeLog:
  - changeSet:
      id: 5
      author: "Oscar Vasquez"
      changes:
        - createTable:
            tableName: zip_exports
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_zip_exports_event
                    references: events(id)
              - column:
                  name: requested_by
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_zip_exports_user
                    references: users(id)
              - column:
                  name: s3_key
                  type: varchar(1024)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: image_count
                  type: int
              - column:
                  name: size_bytes
                  type: bigint
              - column:
                  name: error_message
                  type: varchar(1000)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: timestamptz
              - column:
                  name: expires_at
                  type: timestamptz
        - sql:
            sql: >
              ALTER TABLE zip_exports
              ADD CONSTRAINT ck_zip_exports_status
              CHECK (status IN ('PENDING', 'RUNNING', 'READY', 'FAILED'))
        - createIndex:
            tableName: zip_exports
            indexName: ix_zip_exports_event_id
            columns:
              - column:
                  name: event_id
